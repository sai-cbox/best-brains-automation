# On the host (192.168.86.67):  cp .env.example .env  (fill it in)  &&  docker compose up -d --build
services:
  bb-dashboard:
    build: ..
    restart: unless-stopped
    ports: ["8091:8091"]
    env_file: .env
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google_sa.json
      BACKFILL_WEEKS: "6"
    volumes:
      - ./google_sa.json:/run/secrets/google_sa.json:ro
      - reports:/data/reports
volumes:
  reports:
