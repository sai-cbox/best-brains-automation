# On the host:  cp .env.example .env  (fill it in)  &&  docker compose up -d --build
services:
  bb-dashboard:
    build: ..
    restart: unless-stopped
    ports: ["8091:8091"]
    env_file: .env
    environment:
      BACKFILL_WEEKS: "6"
    volumes:
      - reports:/data/reports
volumes:
  reports:
