name: generate-next-week dry run
# Started by the Schedule button (Apps Script -> workflow_dispatch). Compare only: never writes a schedule sheet or the portal.
on:
  workflow_dispatch:
    inputs:
      center:     { description: 'Center name, e.g. Liberty Hill', required: true }
      input_date: { description: 'Input week column date at click time, mm/dd/yyyy', required: true }
concurrency:
  group: dry-run-${{ inputs.center }}
  cancel-in-progress: false
jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --omit=dev
      - name: Write service account key
        run: |
          umask 077
          printf '%s' "$GOOGLE_SA_KEY" > "$RUNNER_TEMP/sa.json"
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
      - name: Dry run (waits for n8n, then compares)
        run: node src/run.js --mode dry-run --center "$CENTER" --input-date "$INPUT_DATE" --wait-for-n8n --out reports
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          CENTERS_JSON: ${{ vars.CENTERS_JSON }}
          CENTER: ${{ inputs.center }}
          INPUT_DATE: ${{ inputs.input_date }}
